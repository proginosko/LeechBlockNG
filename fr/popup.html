<!DOCTYPE html>

<html lang="fr">

	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<title>LeechBlock</title>
		<link href="/jquery-ui/jquery-ui.min.css" rel="stylesheet">
		<link href="/popup.css" rel="stylesheet">
		<link href="/icons/leechblock32.ico" rel="icon" type="image/x-icon">
		<link href="/icons/leechblock32.ico" rel="shortcut icon" type="image/x-icon">
		<link id="themeLink" rel="stylesheet">
	</head>

	<body>
		<p><img width="200" height="35" src="/images/leechblock_logo.svg" class="logo" alt="Logo LeechBlock" title="LeechBlock"></p>
		<div id="button-container" class="ui-widget">
			<button id="options" type="button">Options</button>
			<button id="lockdown" type="button">Verrouillage</button>
			<button id="override" type="button">Contournement</button>
			<button id="stats" type="button">Statistiques</button>
			<br><br>
			<button id="addSites" type="button">Ajouter des sites</button>
			<button id="cancelOverride" type="button">Annuler le contournement</button>
			<button id="resetRollover" type="button">Réinitialiser le temps reporté</button>
			<button id="discardTime" type="button">Supprimer le temps restant</button>
			<br><br>
			<button id="onlineSupport" type="button">Aide en ligne</button>
		</div>
		<script src="/popup.js"></script>
	</body>

</html>
