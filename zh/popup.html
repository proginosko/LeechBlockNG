<!DOCTYPE html>

<html lang="zh">

	<head>
		<meta charset="utf-8">
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
		<title>LeechBlock</title>
		<link href="/jquery-ui/jquery-ui.min.css" rel="stylesheet">
		<link href="/popup.css" rel="stylesheet">
		<link href="/icons/leechblock32.ico" rel="icon" type="image/x-icon">
		<link href="/icons/leechblock32.ico" rel="shortcut icon" type="image/x-icon">
		<link id="themeLink" rel="stylesheet">
	</head>

	<body>
		<p><img width="200" height="35" src="/images/leechblock_logo.svg" class="logo" alt="LeechBlock logo" title="LeechBlock"></p>
		<div id="button-container" class="ui-widget">
			<button id="options" type="button">选项</button>
			<button id="lockdown" type="button">强制锁定</button>
			<button id="override" type="button">临时解锁</button>
			<button id="stats" type="button">统计数据</button>
			<br><br>
			<button id="addSites" type="button">添加网站</button>
			<button id="cancelOverride" type="button">取消临时解锁</button>
			<button id="resetRollover" type="button">重置滚动时间</button>
			<button id="discardTime" type="button">放弃剩余时间</button>
			<br><br>
			<button id="onlineSupport" type="button">在线支持</button>
		</div>
		<script src="/popup.js"></script>
	</body>

</html>
